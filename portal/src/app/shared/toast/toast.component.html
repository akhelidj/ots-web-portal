<div aria-live="assertive" class="pointer-events-none fixed inset-0 flex items-end px-4 py-6 sm:items-start sm:p-6 z-[9999]">
  <div class="flex w-full flex-col items-center space-y-4 sm:items-end mt-14 sm:mt-0">
    @for (toast of toastService.toasts(); track toast.id) {
      <div 
        @toastAnimation
        class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-lg shadow-lg ring-1 ring-black ring-opacity-5"
        [ngClass]="{
          'bg-white': toast.type === 'success' || toast.type === 'info',
          'bg-error-light border border-error/50': toast.type === 'error',
          'bg-warning-light border border-warning/50': toast.type === 'warning'
        }">
        <div class="p-4">
          <div class="flex items-start">
            <div class="flex-shrink-0">
              
              @if (toast.type === 'success') {
                <svg class="h-6 w-6 text-success" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              }

              @if (toast.type === 'error') {
                <svg class="h-6 w-6 text-error" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              }

              @if (toast.type === 'info') {
                <svg class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                </svg>
              }

              @if (toast.type === 'warning') {
                <svg class="h-6 w-6 text-warning" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              }

            </div>
            <div class="ml-3 w-0 flex-1 pt-0.5">
              @if (toast.title) {
                <p class="text-sm font-bold" 
                   [ngClass]="{'text-gray-900': toast.type === 'success' || toast.type === 'info', 'text-error-dark': toast.type === 'error', 'text-warning-dark': toast.type === 'warning'}">
                  {{ toast.title }}
                </p>
              }
              <p class="mt-1 text-sm text-gray-800" [ngClass]="{'text-gray-500': toast.type === 'success' || toast.type === 'info'}">{{ toast.message }}</p>
            </div>
            <div class="ml-4 flex flex-shrink-0">
              <button type="button" (click)="toastService.removeToast(toast.id)" class="inline-flex rounded-md text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2" 
                      [ngClass]="{'bg-error-light hover:text-error hover:bg-error-light': toast.type === 'error'}">
                <span class="sr-only">Close</span>
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
