<div class="min-h-[60vh] flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center">
    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-primary/10 mb-6">
      <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>

    <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Sign-in Required</h2>
    <p class="text-base text-gray-500 mb-8">
      @if ((isOnline$ | async) === false) {
        Offline mode: authentication is required to access this secure area.
      } @else {
        Please sign in with your credentials to continue to this secure area.
      }
    </p>

    <a routerLink="/login" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-accent hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent transition-colors shadow-sm w-full sm:w-auto">
      Go to Sign In
    </a>
  </div>
</div>
