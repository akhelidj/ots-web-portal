<div
  class="min-h-[calc(100vh-3rem)] flex items-center justify-center py-8 px-4"
>
  <div class="w-full max-w-xl page-section p-6 sm:p-8">
    <div class="mb-6">
      <p class="text-xs uppercase tracking-[0.1em] text-neutral-500">
        First Login Security
      </p>
      <h1
        class="mt-2 text-2xl sm:text-3xl tracking-tight text-neutral-900"
      >
        Change your password
      </h1>
      <p class="mt-2 text-sm text-neutral-600">
        You must update your temporary password before entering the workspace.
      </p>
    </div>

    @if (!connectivity.isOnline()) {
      <div
        class="mb-5 rounded-xl border border-error/30 bg-error-light/10 px-4 py-3 text-sm text-error-dark"
      >
        You are offline. Reconnect to continue.
      </div>
    }

    <form (ngSubmit)="onSubmit()" #passForm="ngForm" class="space-y-5">
      <fieldset
        [disabled]="isLoading || !connectivity.isOnline()"
        class="space-y-5 disabled:opacity-60"
      >
        <div>
          <label for="currentPassword" class="form-label"
            >Current Password</label
          >
          <div class="relative">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              id="currentPassword"
              name="currentPassword"
              [(ngModel)]="currentPassword"
              required
              autocomplete="current-password"
              class="field-control pr-10"
            />
            <button
              type="button"
              (click)="toggleCurrentPassword()"
              class="absolute inset-y-0 right-0 pr-3 text-neutral-500"
            >
              {{ showCurrentPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div>
          <label for="newPassword" class="form-label">New Password</label>
          <div class="relative">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              id="newPassword"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="8"
              autocomplete="new-password"
              class="field-control pr-10"
            />
            <button
              type="button"
              (click)="toggleNewPassword()"
              class="absolute inset-y-0 right-0 pr-3 text-neutral-500"
            >
              {{ showNewPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="form-label"
            >Confirm New Password</label
          >
          <div class="relative">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              autocomplete="new-password"
              class="field-control pr-10"
            />
            <button
              type="button"
              (click)="toggleConfirmPassword()"
              class="absolute inset-y-0 right-0 pr-3 text-neutral-500"
            >
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="
            !passForm.valid || isLoading || confirmPassword !== newPassword
          "
          class="btn btn-primary w-full"
        >
          {{ isLoading ? 'Updating...' : 'Change Password' }}
        </button>
      </fieldset>

      @if (formError) {
        <div class="alert-error">
          {{ formError }}
        </div>
      }

      @if (formSuccess) {
        <div
          class="rounded-xl border border-success/30 bg-success-light/20 px-4 py-3 text-sm font-medium text-success-dark"
        >
          {{ formSuccess }}
        </div>
      }
    </form>
  </div>
</div>
