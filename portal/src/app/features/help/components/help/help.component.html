<div class="max-w-7xl mx-auto py-4 sm:py-8">
  <section
    class="relative overflow-hidden rounded-2xl border border-neutral-200 bg-white p-6 sm:p-8 shadow-sm"
  >
    <div class="relative">
      <p class="text-xs uppercase tracking-[0.14em] text-neutral-500">
        Help Center
      </p>
      <h1 class="mt-2 text-2xl sm:text-3xl font-semibold tracking-tight text-neutral-900">
        How to use Trackline
      </h1>
      <p class="mt-3 max-w-3xl text-sm sm:text-base text-neutral-600">
        This guide is tailored to your role. It lists exactly the capabilities
        and workflows available in your current scope.
      </p>

      <div class="mt-6 flex flex-wrap gap-3">
        <span
          class="inline-flex items-center rounded-full bg-neutral-100 border border-neutral-200 px-3 py-1 text-xs font-semibold uppercase tracking-[0.08em] text-neutral-700"
        >
          Role: {{ roleLabel() }}
        </span>
        <span
          class="inline-flex items-center rounded-full bg-neutral-100 border border-neutral-200 px-3 py-1 text-xs font-semibold uppercase tracking-[0.08em] text-neutral-700"
        >
          App Version: v{{ appVersion }}
        </span>
      </div>
    </div>
  </section>

  <div class="mt-12 space-y-6">
    @for (section of sections(); track section.id) {
      <ng-container *ngComponentOutlet="section.component; inputs: { role: role() }"></ng-container>
    }
  </div>
</div>
