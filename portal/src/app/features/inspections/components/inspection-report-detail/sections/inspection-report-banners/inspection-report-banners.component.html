@if (banners.length) {
  <div class="space-y-3">
    @for (banner of banners; track banner.message) {
      <div
        class="p-4 rounded-lg flex items-start shadow-sm border"
        [ngClass]="{
          'bg-blue-50 text-blue-900 border-blue-200': banner.type === 'info',
          'bg-warning-light text-warning-dark border-warning':
            banner.type === 'warning',
          'bg-error-light text-error-dark border-error':
            banner.type === 'error',
          'bg-success-light text-success-dark border-success':
            banner.type === 'success',
        }"
      >
        <div class="flex-shrink-0 mt-0.5 mr-3">
          @if (banner.type === 'error') {
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd"
              />
            </svg>
          } @else if (banner.type === 'warning') {
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              />
            </svg>
          } @else if (banner.type === 'success') {
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM13.707 9.707a1 1 0 00-1.414-1.414L9 11.586 7.707 10.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd"
              />
            </svg>
          } @else {
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          }
        </div>
        <p class="text-sm font-medium">{{ banner.message }}</p>
      </div>
    }
  </div>
}
