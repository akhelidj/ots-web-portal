<div
  class="grid grid-cols-2 gap-4"
  [ngClass]="{
    'md:grid-cols-5': visibleCols === 5,
    'md:grid-cols-6': visibleCols === 6,
    'md:grid-cols-7': visibleCols === 7,
  }"
>
  <div
    class="page-section p-5 flex flex-col justify-center text-center items-center"
  >
    <span
      class="stat-label"
      >Total Pipes</span
    >
    <span
      class="stat-value text-3xl text-neutral-900 flex items-baseline gap-1"
      >{{ total }}</span
    >
  </div>

  <div
    tabindex="0"
    (click)="open('pass')"
    (keydown.enter)="open('pass')"
    class="bg-white p-5 rounded-xl shadow-sm border border-success/30 hover:border-success/50 transition-colors cursor-pointer flex flex-col justify-center text-center items-center"
  >
    <span
      class="stat-label"
      >Passed</span
    >
    <span class="stat-value text-3xl text-success-dark">{{ pass }}</span>
  </div>

  <div
    tabindex="0"
    (click)="open('actionRequired')"
    (keydown.enter)="open('actionRequired')"
    class="bg-white p-5 rounded-xl shadow-sm border border-warning/30 hover:border-warning/50 transition-colors cursor-pointer flex flex-col justify-center text-center items-center"
  >
    <span
      class="stat-label"
      >Action Required</span
    >
    <span class="stat-value text-3xl text-warning-dark">{{
      actionRequired
    }}</span>
  </div>

  <div
    tabindex="0"
    (click)="open('reject')"
    (keydown.enter)="open('reject')"
    class="bg-white p-5 rounded-xl shadow-sm border border-error/30 hover:border-error/50 transition-colors cursor-pointer flex flex-col justify-center text-center items-center"
  >
    <span
      class="stat-label"
      >Rejected</span
    >
    <span class="stat-value text-3xl text-error-dark">{{ rejected }}</span>
  </div>

  @if (hold > 0) {
    <div
      tabindex="0"
      (click)="open('hold')"
      (keydown.enter)="open('hold')"
      class="bg-white p-5 rounded-xl shadow-sm border border-primary/20 hover:border-primary/40 transition-colors cursor-pointer flex flex-col justify-center text-center items-center"
    >
      <span
        class="stat-label"
        >Hold</span
      >
      <span class="stat-value text-3xl text-primary">{{ hold }}</span>
    </div>
  }

  @if (other > 0) {
    <div
      tabindex="0"
      (click)="open('other')"
      (keydown.enter)="open('other')"
      class="bg-white p-5 rounded-xl shadow-sm border border-neutral-300 hover:border-neutral-400 transition-colors cursor-pointer flex flex-col justify-center text-center items-center"
    >
      <span
        class="stat-label"
        >Other</span
      >
      <span class="stat-value text-3xl text-neutral-700">{{ other }}</span>
    </div>
  }

  <div
    class="page-section p-5 flex flex-col justify-center items-center text-center bg-neutral-50"
  >
    <span
      class="stat-label"
      >Pass Rate</span
    >
    <span
      class="stat-value text-3xl flex items-baseline gap-0.5"
      [ngClass]="{
        'text-success-dark': passRate === 100,
        'text-warning-dark': passRate > 0 && passRate < 100,
        'text-error-dark': passRate === 0,
      }"
      >{{ passRate }}<span class="text-xl">%</span></span
    >
  </div>
</div>
