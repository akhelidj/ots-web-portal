<div class="w-full xl:w-[320px] shrink-0 space-y-6">
  <div class="page-section p-6 flex flex-col h-fit">
    <h2
      class="text-lg font-semibold text-neutral-900 mb-2 border-b border-neutral-200 pb-2"
    >
      Register Inventory
    </h2>
    <p class="text-xs text-neutral-500 mb-4">
      Paste multiple serial numbers (one per line):
    </p>

    <textarea
      [ngModel]="value"
      (ngModelChange)="valueChange.emit($event)"
      rows="6"
      class="w-full border border-neutral-300 p-3 rounded-md mb-4 focus:ring-accent focus:border-accent font-mono text-sm shadow-sm transition-colors"
      placeholder="SN-001&#10;SN-002&#10;SN-003"
      [disabled]="!enabled"
    ></textarea>

    <button
      (click)="onSubmit()"
      [disabled]="!value.trim() || !enabled"
      class="w-full bg-primary hover:bg-primary/95 text-white py-2.5 rounded-md text-sm font-medium transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Add serial numbers
    </button>
  </div>
</div>
