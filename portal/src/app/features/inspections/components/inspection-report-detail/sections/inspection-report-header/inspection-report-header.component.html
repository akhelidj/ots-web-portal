<div
  class="page-section p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
  [ngClass]="isCustomer ? 'sticky top-16 z-50' : ''"
>
  <div class="flex items-center gap-4">
    <a
      routerLink=".."
      class="text-neutral-500 hover:text-primary transition-colors flex items-center justify-center h-10 w-10 rounded-full hover:bg-neutral-100"
    >
      <svg
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
    </a>
    <div>
      <h1
        class="text-2xl sm:text-3xl font-semibold tracking-tight text-neutral-900"
      >
        Report: {{ report.poNumber }}
      </h1>
    </div>
  </div>

  <div class="flex items-center gap-3">
    @if (userRole !== APP_ROLES.CUSTOMER) {
      <span
        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-widest"
        [ngClass]="{
          'bg-error-light text-error-dark':
            report.syncState === 'CONFLICT' || report.syncState === 'ERROR',
          'bg-warning-light text-warning-dark': report.syncState === 'PENDING',
          'bg-success-light text-success-dark': report.syncState === 'SYNCED',
        }"
      >
        {{ report.syncState }}
      </span>
    }

    @if (showCustomerExport) {
      <button
        (click)="onExport()"
        class="flex items-center gap-1.5 bg-primary hover:bg-primary/90 text-white px-4 py-2 text-sm font-semibold rounded-lg shadow transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isExporting || !canExport || !isOnline"
        [title]="
          !isOnline
            ? 'Export requires internet connection'
            : exportDisabledReason || 'Download Export'
        "
      >
        @if (isExporting) {
          <svg
            class="animate-spin h-4 w-4"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Exporting...
        } @else {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          Export Excel
        }
      </button>
    }
  </div>
</div>
