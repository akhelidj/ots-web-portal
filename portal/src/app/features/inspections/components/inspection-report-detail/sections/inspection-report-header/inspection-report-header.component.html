<div
  class="page-section relative overflow-hidden flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all duration-300 ease-out"
  [style.padding-top.px]="16 - 4 * condenseProgress"
  [style.padding-bottom.px]="16 - 4 * condenseProgress"
  [style.padding-left.px]="16 - 4 * condenseProgress"
  [style.padding-right.px]="16 - 4 * condenseProgress"
  [ngClass]="isCondensed ? 'rounded-none border-x-0 shadow-md' : ''"
>
  <div class="flex items-start sm:items-center gap-3 sm:gap-4 min-w-0">
    <a
      routerLink=".."
      class="text-neutral-500 hover:text-primary transition-all duration-300 flex items-center justify-center rounded-xl border border-neutral-200 bg-white hover:bg-neutral-50 shrink-0"
      [style.width.px]="40 - 4 * condenseProgress"
      [style.height.px]="40 - 4 * condenseProgress"
      title="Back to reports"
    >
      <svg
        class="transition-all duration-300"
        [style.width.px]="24 - 4 * condenseProgress"
        [style.height.px]="24 - 4 * condenseProgress"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
    </a>
    <div class="min-w-0">
      <h1
        class="font-semibold tracking-tight text-neutral-900 transition-all duration-300 truncate"
        [style.font-size.rem]="1.5 - 0.375 * condenseProgress"
        [style.line-height]="1.2"
      >
        Report: {{ report.reportNumber }}
      </h1>

      <div class="mt-2 flex flex-wrap items-center gap-2">
        <span class="data-chip-info text-[10px]">
          {{ report.status }}
        </span>

        @if (report.poNumber) {
          <span
            class="inline-flex items-center rounded-md border border-neutral-200 bg-neutral-50 px-2 py-0.5 text-[11px] font-medium text-neutral-600"
          >
            PO: {{ report.poNumber }}
          </span>
        }

        <span
          class="inline-flex items-center rounded-md border border-neutral-200 bg-neutral-50 px-2 py-0.5 text-[11px] text-neutral-500"
        >
          Updated {{ report.updatedAt | date: 'MMM d, y' }}
        </span>
      </div>
    </div>
  </div>

  <div
    class="flex flex-wrap sm:flex-nowrap items-center gap-2 sm:gap-3 w-full sm:w-auto sm:justify-end"
  >
    @if (showCustomerExport) {
      <button
        (click)="onExport()"
        class="w-full sm:w-auto justify-center flex items-center gap-1.5 bg-primary hover:bg-primary/90 text-white px-4 py-2 text-sm font-semibold rounded-lg shadow transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isExporting || !canExport || !isOnline"
        [title]="
          !isOnline
            ? 'Export requires internet connection'
            : exportDisabledReason || 'Download Export'
        "
      >
        @if (isExporting) {
          <svg
            class="animate-spin h-4 w-4"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Exporting...
        } @else {
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          Export Excel
        }
      </button>
    }
  </div>
</div>
