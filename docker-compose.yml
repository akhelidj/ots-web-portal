services:
  postgres:
    image: postgres:16-alpine
    container_name: ots_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ots_db}
    ports:
      - '5432:5432'
    volumes:
      - ots_postgres_data:/var/lib/postgresql/data

  # Headless LibreOffice behind HTTP — converts the filled Excel export to PDF.
  # The API reads PDF_CONVERTER_URL (http://localhost:3001 for local dev).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ots_gotenberg
    restart: always
    ports:
      - '3001:3000'

volumes:
  ots_postgres_data:
