name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          SKIP_GIT_HOOKS: '1'
      - run: npx prisma generate --schema api/prisma/schema.prisma
      - run: npm run format:check
      - run: npx nx run-many -t lint typecheck test build --parallel=3

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ots_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          SKIP_GIT_HOOKS: '1'
      - run: npx prisma generate --schema api/prisma/schema.prisma
      - name: Write the test env
        run: echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/ots_test" > api/.env.test
      - run: npx nx run api:test-integration
